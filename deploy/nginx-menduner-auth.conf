# Only requests that CHANGE data require a password. Reading needs none, so the site opens
# without a login prompt and a wrong password can never make it look broken.
#
# Installed as /etc/nginx/conf.d/menduner-auth.conf. The site file deploy/nginx-menduner.conf
# consumes $menduner_deny as its auth_basic value.
#
# The backend enforces the same rule again (backend/auth.py) from the X-Menduner-Login header
# the site file forwards, so losing this file fails loudly (401 on writes) instead of silently
# opening every write endpoint again.
map $request_method $menduner_deny {
    default       "Menduner";
    GET           off;
    HEAD          off;
    OPTIONS       off;
}
