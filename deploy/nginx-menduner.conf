# Menduner 站点:域名走 HTTPS,原始 IP 保留明文 HTTP(已发出的链接不失效)
#
# 应用本身的 location(认证、反代、SPA 回退、缓存头)放在
# /etc/nginx/snippets/menduner-app.conf,三个 server 块共享同一份,避免认证规则漂移。
#
# 域名与证书(2026-10-18):
#   entgroup14.com / www.entgroup14.com -> A 47.116.133.230(阿里云云解析)
#   Let's Encrypt 证书在 /etc/letsencrypt/live/entgroup14.com/,certbot.timer 自动续期。
#   注意:大陆服务器绑定域名需 ICP 备案;未备案时阿里云会拦截外部 80 端口(返回其拦截页),
#   因此 HTTP-01 自动续期会失败 —— 处理方式见 deploy/DEPLOY.md「域名与 HTTPS」一节。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.116.133.230;
    include /etc/nginx/snippets/menduner-app.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name entgroup14.com www.entgroup14.com;

    # Keep the ACME challenge reachable even if the site redirects everything else.
    location /.well-known/acme-challenge/ {
        root /srv/menduner/frontend-dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name entgroup14.com www.entgroup14.com;

    ssl_certificate /etc/letsencrypt/live/entgroup14.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entgroup14.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MendunerTLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/menduner-app.conf;
}
