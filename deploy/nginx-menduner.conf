# Menduner production site.
#
# Replaces what the Vite dev server did in development. Vite proxied two things:
#   /api          -> FastAPI on 127.0.0.1:8000
#   /_AMapService -> AMap, injecting the jscode security signature
# The first is required. The second is OPTIONAL and is left out here on purpose:
# without it the map still renders, it just loses custom map styles. If you want the styled
# map back, see the commented block at the bottom — it needs a small extra proxy process
# because nginx cannot compute the AMap signature itself.
#
# Replace __SERVER_NAME__ with your public IP, or with your domain once it resolves.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /srv/menduner/frontend-dist;  # deploy-frontend.sh writes here
    index index.html;

    # Uploaded database is ~105 MB; keep the upload ceiling above it for convenience.
    client_max_body_size 200m;

    # Security headers. No CSP is set because the AMap SDK loads third-party scripts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames, so an asset's content never changes under the same
    # name and it can be cached hard. This is only safe because index.html is never cached —
    # see below.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must ALWAYS be revalidated, and this is not an optimisation detail.
    #
    # A cached index.html names the previous build's fingerprinted chunks. After a deploy those
    # files are gone, so the stale page requests files that no longer exist. That is exactly
    # what happened: the knowledge-graph page failed with
    #   "Unable to preload CSS for /assets/index-BnuhLJ6X.css"
    # because the browser was running a cached index.html from the build before last. Vite's
    # lazy-chunk CSS is the visible symptom of a far wider breakage — the cache-invalidation
    # contract is that hashed assets may be cached forever ONLY while the HTML that names them
    # is fetched fresh.
    location = /index.html {
        # no-cache still permits storing a copy; it forces revalidation on every use, so a
        # deploy takes effect on the next page load instead of whenever the cache expires.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # The API is unauthenticated. Basic auth is the minimum bar before this is reachable
    # from the internet; create the file with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd menduner
    location /api/ {
        # auth_basic "Menduner";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The crawler uses POST /crawl and can run for minutes; do not cut it off at 60s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # AMap JS API v2 sends the REST calls it cannot sign in the browser to
    # _AMapSecurityConfig.serviceHost. This deployment has no such proxy, and it must NOT let the
    # SPA fallback answer those routes: the SDK asks for JSON and JSONP, so an HTML body is
    #   SyntaxError: Unexpected token '<'
    # in every visitor's console (and was, until this block existed). Answer in the shape the SDK
    # expects instead: valid JavaScript for a JSONP callback, AMap's own error envelope otherwise.
    # If a signed proxy is ever deployed (see vite.config.ts), point this block at it instead.
    location ^~ /_AMapService/ {
        if ($arg_callback) {
            add_header Content-Type "application/javascript";
            return 200 "/* AMap service proxy not configured on this deployment */";
        }
        default_type application/json;
        return 200 '{"status":"0","info":"AMAP_SERVICE_PROXY_NOT_CONFIGURED"}';
    }

    # Single-page app: every unknown path must return index.html, not a 404. Deep links land
    # here, so this must not be cached either.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # location /_AMapService/ {
    #   # Requires the signature proxy from vite.config.ts to be running, e.g. on :8010.
    #   # rewrite ^/_AMapService/(.*)$ /$1 break;
    #   # proxy_pass http://127.0.0.1:8010;
    # }
}
