# Local, reproducible stack: web (nginx + built frontend) + api (FastAPI) + neo4j.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:8080
#
# The SQLite database stays the single source of truth. Neo4j is a *derived* view: the sync script
# rebuilds it from SQLite, so a broken graph is repaired by re-running the sync, never by editing
# the graph and hoping the database agrees.
name: menduner

services:
  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      MENDUNER_DB_PATH: /data/menduner.sqlite3
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-menduner-dev-only}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # Bind mount, not a named volume: the database is the one thing a developer wants to open
      # with a sqlite browser while the stack runs.
      - ../data:/data
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-menduner-dev-only}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j-data:
