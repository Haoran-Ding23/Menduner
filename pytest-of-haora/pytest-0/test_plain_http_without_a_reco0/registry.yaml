  last_checked: '2026-10-13T20:46:57.659144+00:00'
  limitation: 'Secondary/aggregator publisher: titles and 来源 credits come from venue
    WeChat accounts, so its claims stay Unverified/Needs Review and are never Verified.
    The calendar is not ordered by event date; paging is swept to the verified horizon
    and never follows the advertised 662 pages. Only max_items bounds detail requests.
    Records without a real 时间 date and 地点 value are rejected, never published.'
  priority: 1
  reason: 'No explicit 地点 (venue/location) on the visitsz detail page: ''详见文章''; placeholder
    and template values are never published'
  require_events: true
